name: postformer-cpu-train

# Chunked/resumed/parallel CPU training for the PostFormer S-tiny gate matrix
# (issue #294). Runs ONLY on manual dispatch (no push trigger): the
# Maintainer launches training the moment the Tester greens PR #295, and
# re-dispatches until every arm reports CHUNK_DONE. Each job advances one
# arm by at most --chunk-steps optimizer steps, then uploads its checkpoint
# dir as an artifact; the next dispatch resumes bit-identically from the
# latest successful run's artifact (same data stream, same cosine position,
# same optimizer state). Scope is full-budget per the 2026-09-09
# clarification: chunking changes execution, never the experiment size.
#
# Refs #294 (never Closes: only a gate-green Builder PR may close #294).

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Gate preset from postformer/harness/gate_matrix.json"
        required: false
        default: "toy-smoke"
        type: choice
        options:
          - toy-smoke
          - gate-tiny-mqar
          - gate-tiny-markov
      chunk_steps:
        description: "Max optimizer steps per job (must fit in 6h CPU)"
        required: false
        default: "250"
      models:
        description: "Space-separated model filter (empty = full preset)"
        required: false
        default: ""
      seeds:
        description: "Space-separated seed filter (empty = full preset)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: postformer-cpu-train-${{ inputs.preset || 'manual' }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  PYTHONPATH: "."

jobs:
  plan:
    name: Expand gate matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      arms: ${{ steps.expand.outputs.arms }}
      hparams: ${{ steps.expand.outputs.hparams }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Expand preset to arm matrix
        id: expand
        env:
          PRESET: ${{ inputs.preset }}
          MODELS_FILTER: ${{ inputs.models }}
          SEEDS_FILTER: ${{ inputs.seeds }}
          CHUNK_STEPS: ${{ inputs.chunk_steps }}
        run: |
          python3 <<'EOF'
          import json, os
          preset = os.environ.get("PRESET") or "toy-smoke"
          with open("postformer/harness/gate_matrix.json") as f:
              matrix = json.load(f)
          if preset not in matrix["presets"]:
              raise SystemExit(f"unknown preset {preset!r}")
          p = matrix["presets"][preset]
          models_f = os.environ.get("MODELS_FILTER", "")
          seeds_f = os.environ.get("SEEDS_FILTER", "")
          models = models_f.split() or p["models"]
          seeds = [int(s) for s in seeds_f.split()] or p["seeds"]
          unknown = [m for m in models if m not in p["models"]]
          if unknown:
              raise SystemExit(f"models not in preset {preset!r}: {unknown}")
          arms = [{"model": m, "seed": s} for m in models for s in seeds]
          chunk = int(os.environ.get("CHUNK_STEPS") or matrix.get("chunk_steps_default", 250))
          hp = {k: p[k] for k in ("steps", "batch", "data", "vocab", "lr", "warmup") if k in p}
          hp["n_pairs"] = p.get("n_pairs", 8)
          hp["seq_len"] = p.get("seq_len", 128)
          hp["chunk_steps"] = chunk
          print(f"preset={preset} arms={len(arms)} hparams={hp}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"arms={json.dumps(arms)}\n")
              f.write(f"hparams={json.dumps(hp)}\n")
          EOF

  train:
    name: Train chunk
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.arms) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU torch)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          if [ -f postformer/requirements.txt ]; then
            pip install --quiet -r postformer/requirements.txt
          else
            pip install --quiet numpy pyyaml pytest
          fi
          python3 -c "import torch; print(torch.__version__)"

      - name: Resume from latest successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arm_dir="postformer/ledger/checkpoints/${{ matrix.model }}-s${{ matrix.seed }}"
          mkdir -p "$arm_dir"
          if [ -f "$arm_dir/CHUNK_DONE" ]; then
            echo "Arm already complete, skipping resume fetch."
            exit 0
          fi
          last_id=$(gh run list --repo "${{ github.repository }}" --workflow postformer-cpu-train.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$last_id" ]; then
            gh run download --repo "${{ github.repository }}" "$last_id" -n "ckpt-${{ matrix.model }}-s${{ matrix.seed }}" -D "$arm_dir" || echo "No prior artifact for this arm, starting fresh."
          else
            echo "No prior successful run, starting fresh."
          fi

      - name: Run training chunk
        run: |
          hp='${{ needs.plan.outputs.hparams }}'
          get() { python3 -c "import json,sys; print(json.loads(sys.argv[1])['$1'])" "$hp"; }
          arm_dir="postformer/ledger/checkpoints/${{ matrix.model }}-s${{ matrix.seed }}"
          if [ -f "$arm_dir/CHUNK_DONE" ]; then
            echo "Arm already complete, nothing to do."
            exit 0
          fi
          python3 -m postformer.harness.train_chunk \
            --model "${{ matrix.model }}" \
            --data "$(get data)" \
            --vocab "$(get vocab)" \
            --n-pairs "$(get n_pairs)" \
            --seq-len "$(get seq_len)" \
            --steps "$(get steps)" \
            --batch "$(get batch)" \
            --lr "$(get lr)" \
            --warmup "$(get warmup)" \
            --seed "${{ matrix.seed }}" \
            --chunk-steps "$(get chunk_steps)" \
            --out "$arm_dir"

      - name: Upload checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckpt-${{ matrix.model }}-s${{ matrix.seed }}
          path: postformer/ledger/checkpoints/${{ matrix.model }}-s${{ matrix.seed }}
          retention-days: 30
          overwrite: true

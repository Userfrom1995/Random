name: poolduel-m2

# Poolduel M2 modes + I/O + workload twins (issue #302). Sixteen chunk jobs,
# each with its own direct-PG control arm, each under 60 minutes, resumable
# via manifest. Runs ONLY on manual dispatch (no push trigger): the
# Maintainer launches the sweep once the harness PR is Tester-green.
#
# Refs #302 (never Closes: only the final M3 report may close #302).

on:
  workflow_dispatch:
    inputs:
      chunk:
        description: "Chunk to run (empty = all sixteen)"
        required: false
        default: ""
      ref:
        description: "Git ref to benchmark (default main)"
        required: false
        default: "main"

permissions:
  contents: read
  actions: read

concurrency:
  group: poolduel-m2-${{ inputs.chunk || 'all' }}
  cancel-in-progress: false

env:
  PYTHONPATH: "."

jobs:
  sweep:
    name: M2 sweep chunk
    runs-on: ubuntu-24.04
    # Measurement per chunk stays under 60 min per poolduel/docs/test-matrix.md
    # section 5; the extra cap covers one-time pinned source builds below
    # (pgcat compiles from source, no v1.2.0 release assets exist).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chunk: [m2a1, m2a2, m2b1, m2b2, m2c, m2d1, m2d2, m2e,
                m2f1, m2f2, m2g1, m2g2, m2h1, m2h2, m2i1, m2i2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL 17
        run: |
          set -eux
          # ubuntu-24.04 (noble) stock apt has no postgresql-17; PG 17 is
          # pinned per poolduel/docs/versions.md so add the PGDG repo first.
          # Ref: https://www.postgresql.org/download/linux/ubuntu/
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | \
            sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17
          pgbench --version
          sudo pg_lsclusters || true

      - name: Build poolers (pinned versions)
        run: |
          set -eux
          # Pinned per poolduel/docs/versions.md; any upgrade means a re-run,
          # never carried-forward numbers. pgagroal pins its master tip SHA
          # at build time and discloses it (see pooler-versions step below).
          # Refs:
          # https://www.pgbouncer.org/downloads/
          # https://www.pgpool.net/docs/pgpool-II-4.7.2/en/html/install-getsource.html
          # https://github.com/yandex/odyssey/releases/tag/v1.5.1
          # https://github.com/pgagroal/pgagroal
          # https://github.com/postgresml/pgcat/releases/tag/v1.2.0
          sudo apt-get install -y -qq libevent-dev libssl-dev \
            libpq-dev pkg-config build-essential git curl cmake \
            flex bison libev-dev
          mkdir -p /tmp/poolers
          cd /tmp/poolers
          # --- PgBouncer 1.25.2 (2026-05-08) ---
          curl -fsSL -o pgbouncer-1.25.2.tar.gz \
            https://www.pgbouncer.org/downloads/files/1.25.2/pgbouncer-1.25.2.tar.gz
          sha256sum pgbouncer-1.25.2.tar.gz | tee pgbouncer-1.25.2.sha256
          tar xzf pgbouncer-1.25.2.tar.gz
          cd pgbouncer-1.25.2
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          cd /tmp/poolers
          # --- pgpool-II 4.7.2 (head of 4.7 series, 2026-06-04) ---
          curl -fsSL -o pgpool-II-4.7.2.tar.gz \
            https://www.pgpool.net/source/pgpool-II-4.7.2.tar.gz
          sha256sum pgpool-II-4.7.2.tar.gz | tee pgpool-II-4.7.2.sha256
          tar xzf pgpool-II-4.7.2.tar.gz
          cd pgpool-II-4.7.2
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          cd /tmp/poolers
          # --- Odyssey v1.5.1 stable (2026-07-12) ---
          git clone --branch v1.5.1 --depth 1 \
            https://github.com/yandex/odyssey.git odyssey-1.5.1
          cd odyssey-1.5.1
          git rev-parse HEAD | tee /tmp/poolers/odyssey.sha
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j"$(nproc)"
          sudo make install || sudo install -m 0755 odyssey /usr/local/bin/odyssey
          cd /tmp/poolers
          # --- pgagroal master tip (SHA pinned at build, disclosed) ---
          git clone https://github.com/pgagroal/pgagroal.git pgagroal-tip
          cd pgagroal-tip
          git rev-parse HEAD | tee /tmp/poolers/pgagroal.sha
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j"$(nproc)"
          sudo make install
          cd /tmp/poolers
          # --- pgcat v1.2.0 (2024-08-30; release carries no binary
          # --- assets, so build the v1.2.0 tag from source with cargo) ---
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          git clone --branch v1.2.0 --depth 1 \
            https://github.com/postgresml/pgcat.git pgcat-1.2.0
          cd pgcat-1.2.0
          git rev-parse HEAD | tee /tmp/poolers/pgcat.sha
          cargo build --release
          sudo install -m 0755 target/release/pgcat /usr/local/bin/pgcat
          cd /tmp/poolers

      - name: Verify pooler binaries
        run: |
          set -eux
          export PATH="/usr/local/bin:$HOME/.cargo/bin:$PATH"
          # Fail loudly here (before any pgbench minute is spent) if any
          # pooler binary the harness adapters exec is missing from PATH.
          for bin in pgbouncer pgpool odyssey pgagroal pgcat; do
            command -v "$bin" || { echo "missing pooler binary: $bin" >&2; exit 1; }
          done
          pgbouncer --version || true
          pgpool --version || true
          odyssey --version || true
          pgagroal --version || true
          pgcat --version || true
          echo "--- pinned SHAs ---"
          cat /tmp/poolers/pgagroal.sha
          cat /tmp/poolers/odyssey.sha
          cat /tmp/poolers/pgcat.sha

      - name: Init dataset and checkpoint
        run: |
          set -eux
          sudo service postgresql start || sudo pg_ctlcluster 17 main start
          sudo -u postgres psql -c "CREATE ROLE benchuser WITH LOGIN SUPERUSER PASSWORD 'benchpass';" || true
          sudo -u postgres psql -c "CREATE DATABASE benchdb OWNER benchuser;" || true
          PGPASSWORD=benchpass pgbench -h 127.0.0.1 -U benchuser -i -s 10 benchdb
          PGPASSWORD=benchpass psql -h 127.0.0.1 -U benchuser -d benchdb -c "CHECKPOINT;"

      - name: Preflight check
        run: |
          python3 poolduel/harness/check.py

      - name: Run M2 chunk
        if: ${{ inputs.chunk == '' || inputs.chunk == matrix.chunk }}
        env:
          PGPASSWORD: benchpass
        run: |
          python3 -m poolduel.harness.cli --matrix m2 \
            --chunk "${{ matrix.chunk }}" \
            --threads "$(nproc)" --out "poolduel/results/m2-${{ matrix.chunk }}"

      - name: Emit N/A records (unsupported rows, once per sweep)
        if: ${{ inputs.chunk == '' || inputs.chunk == 'm2c' }}
        run: |
          python3 -m poolduel.harness.cli --matrix m2 --write-na \
            --out "poolduel/results/m2-na"

      - name: Record pooler versions
        if: always()
        run: |
          set -eux
          out="poolduel/results/m2-${{ matrix.chunk }}"
          mkdir -p "$out"
          {
            echo "pgbouncer 1.25.2 tarball sha256:"
            cat /tmp/poolers/pgbouncer-1.25.2.sha256 2>/dev/null || echo "n/a"
            echo "pgpool-II 4.7.2 tarball sha256:"
            cat /tmp/poolers/pgpool-II-4.7.2.sha256 2>/dev/null || echo "n/a"
            echo "odyssey v1.5.1 git SHA:"
            cat /tmp/poolers/odyssey.sha 2>/dev/null || echo "n/a"
            echo "pgagroal master tip SHA:"
            cat /tmp/poolers/pgagroal.sha 2>/dev/null || echo "n/a"
            echo "pgcat v1.2.0 git SHA:"
            cat /tmp/poolers/pgcat.sha 2>/dev/null || echo "n/a"
            echo "binaries:"
            command -v pgbouncer; command -v pgpool; command -v odyssey
            command -v pgagroal; command -v pgcat
          } > "$out/pooler-versions.txt"
          cat "$out/pooler-versions.txt"

      - name: Upload chunk results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poolduel-m2-${{ matrix.chunk }}
          path: poolduel/results/m2-${{ matrix.chunk }}
          retention-days: 30
          overwrite: true

      - name: Upload N/A records
        if: ${{ inputs.chunk == '' || inputs.chunk == 'm2c' }}
        uses: actions/upload-artifact@v4
        with:
          name: poolduel-m2-na
          path: poolduel/results/m2-na
          retention-days: 30
          overwrite: true

  aggregate:
    name: Aggregate M2 medians
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download chunk artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: poolduel-m2-*
          path: /tmp/poolduel-m2-artifacts
          merge-multiple: false

      - name: Merge raw records and rebuild medians
        env:
          PYTHONPATH: "."
        run: |
          set -eux
          mkdir -p poolduel/results/m2/raw
          if [ -d /tmp/poolduel-m2-artifacts ]; then
            for rawdir in $(find /tmp/poolduel-m2-artifacts -type d -name raw 2>/dev/null); do
              for f in "$rawdir"/*.json; do
                [ -f "$f" ] || continue
                case "$(basename "$f")" in
                  manifest.json|summary.json|medians.json|report.json|comparisons.json)
                    continue ;;
                esac
                cp "$f" poolduel/results/m2/raw/
              done
            done
            for vf in $(find /tmp/poolduel-m2-artifacts -name pooler-versions.txt 2>/dev/null); do
              parent="$(basename "$(dirname "$vf")")"
              cp "$vf" "poolduel/results/m2/pooler-versions-$parent.txt"
            done
          fi
          python3 -m poolduel.harness.cli --matrix m2 --write-na \
            --out poolduel/results/m2
          if ! ls poolduel/results/m2/raw/*.json >/dev/null 2>&1; then
            echo "poolduel-m2 aggregate: no raw cell records, nothing to commit" >&2
            exit 1
          fi
          sh poolduel/repro.sh --report

      - name: Commit and push results
        env:
          TARGET_REF: ${{ inputs.ref }}
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add poolduel/results
          if git diff --cached --quiet; then
            echo "poolduel-m2 aggregate: no changes to commit"
            exit 0
          fi
          git commit -m "poolduel M2 sweep results (Refs #302)"
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if git pull --rebase origin "$TARGET_REF" && git push origin "HEAD:$TARGET_REF"; then
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 10
          done
          echo "poolduel-m2 aggregate: push failed after 3 attempts" >&2
          exit 1

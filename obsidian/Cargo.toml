[workspace]
resolver = "2"
members = [
    "crates/obsidian-core",
    "crates/obsidian-cli",
    "crates/obsidian-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.74"

[workspace.dependencies]
obsidian-core = { path = "crates/obsidian-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1